# templates/cpp-build.yml — GitLab CI/CD component: configure, build and test ONE CMake preset.
#
# Include once per preset (parallel jobs in the build-test stage):
#   include:
#     - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/cpp-build@$CI_COMMIT_SHA
#       inputs: { preset: ci-linux-gcc, image: $XP_LINUX_IMAGE, cache_key: vcpkg-x64-linux }
#
# Step logic lives in tools/ci/run_step.py; its exit codes are the component's contract:
#   81 format   82 lint   83 build   84 test failures   85 zero tests discovered
#   86 build budget exceeded (wall time / sccache hit-rate regression vs main-branch baseline)
# (format/lint run as their own pipeline stages but use the same script and codes.)
#
# Pipeline-level variables the job expects (set by .gitlab-ci.yml workflow rules):
#   XP_CACHE_POLICY      pull | pull-push   (pull-push only on protected refs)
#   XP_VCPKG_CACHE_MODE  read | readwrite   (vcpkg binary cache, see docs/caching.md)
#   XP_BUDGET_MODE       check | record     (record appends to the baseline on protected refs)
spec:
  inputs:
    preset:
      description: CMake configure/build/test preset name (CMakePresets.json).
    image:
      description: Container image with the toolchain for this preset (pin by tag or digest).
    cache_key:
      description: >-
        GitLab cache key for the vcpkg binary cache. Share it only between presets whose
        dependencies have identical ABI (same image + triplet).
    runner_tags:
      type: array
      default: []
      description: Runner tags, e.g. [windows, msvc] for the Windows preset.
    python:
      default: python3
      description: Python launcher in the image (python3 on Linux, python on Windows).
---
"build-test:$[[ inputs.preset ]]":
  stage: build-test
  image: $[[ inputs.image ]]
  tags: $[[ inputs.runner_tags ]]
  variables:
    XP_VCPKG_CACHE_DIR: $CI_PROJECT_DIR/.vcpkg-cache
    SCCACHE_DIR: $CI_PROJECT_DIR/.sccache   # sandbox; production: S3 bucket (docs/caching.md)
    XP_BUDGET_BASELINE: .ci-baseline/$[[ inputs.preset ]].json
  cache:
    - key: $[[ inputs.cache_key ]]
      paths: [.vcpkg-cache/]
      policy: $XP_CACHE_POLICY
      when: always
    - key: sccache-$[[ inputs.preset ]]
      paths: [.sccache/]
      policy: $XP_CACHE_POLICY
      when: always
    - key: build-baseline-$[[ inputs.preset ]]
      paths: [.ci-baseline/]
      policy: $XP_CACHE_POLICY
  script:
    - $[[ inputs.python ]] tools/ci/run_step.py build --preset $[[ inputs.preset ]]
    # quarantined tests (tests/quarantine.txt) first: report only, never fails the job
    - $[[ inputs.python ]] tools/ci/run_step.py test-quarantined --preset $[[ inputs.preset ]]
    - $[[ inputs.python ]] tools/ci/run_step.py test --preset $[[ inputs.preset ]]
    - $[[ inputs.python ]] tools/ci/run_step.py budget --preset $[[ inputs.preset ]]
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - build/$[[ inputs.preset ]]/junit.xml
        - build/$[[ inputs.preset ]]/junit-quarantine.xml
